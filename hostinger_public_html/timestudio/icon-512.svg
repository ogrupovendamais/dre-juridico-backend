<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="djBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06164A"/>
      <stop offset="50%" stop-color="#010E38"/>
      <stop offset="100%" stop-color="#010822"/>
    </linearGradient>
    <linearGradient id="djGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#F6CA4E"/>
      <stop offset="80%" stop-color="#EBB52C"/>
      <stop offset="100%" stop-color="#C99317"/>
    </linearGradient>
    <filter id="djShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#djBg)"/>

  <!-- Luxury Gold Perimeter Accent -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="url(#djGold)" stroke-width="12" stroke-opacity="0.85"/>

  <!-- Inner Soft Inset Glow -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.08"/>

  <!-- Monogram Group (D in Pure White, J in Executive Gold) -->
  <g filter="url(#djShadow)">
    <!-- LETTER D (Pure White, Bold Geometric Executive Sans) -->
    <path fill="#FFFFFF" fill-rule="evenodd" d="
      M 86,128 
      H 198 
      C 264,128 304,166 304,256 
      C 304,346 264,384 198,384 
      H 86 
      Z 
      M 144,184 
      V 328 
      H 192 
      C 228,328 246,304 246,256 
      C 246,208 228,184 192,184 
      Z
    "/>

    <!-- LETTER J (Radiant Executive Gold with Top Cap & Balanced Hook) -->
    <path fill="url(#djGold)" d="
      M 312,128 
      H 426 
      V 182 
      H 382 
      V 312 
      C 382,360 354,386 302,386 
      C 266,386 240,372 224,350 
      L 264,310 
      C 274,324 286,334 304,334 
      C 322,334 330,322 330,300 
      V 182 
      H 312 
      Z
    "/>

    <!-- Subtle Luxury Sparkle Accent: Gold Diamond on Upper Right -->
    <path d="M 438,104 L 444,116 L 456,122 L 444,128 L 438,140 L 432,128 L 420,122 L 432,116 Z" fill="#FFE082" opacity="0.95"/>
  </g>
</svg>