<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="djBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020E3B"/>
      <stop offset="100%" stop-color="#000620"/>
    </linearGradient>
    <linearGradient id="djGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE6A"/>
      <stop offset="40%" stop-color="#F6CA4E"/>
      <stop offset="80%" stop-color="#EBB52C"/>
      <stop offset="100%" stop-color="#D49B18"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle Deep Navy -->
  <rect width="512" height="512" rx="112" fill="url(#djBg)"/>

  <!-- Moldura Dourada Perimetral (Idêntica ao modelo original CJ) -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#djGold)" stroke-width="24"/>

  <!-- MONOGRAMA DJ (D em Branco #FFFFFF, J em Dourado #EBB52C - Tipografia Idêntica ao Modelo) -->
  <!-- LETRA D: Geometria idêntica ao 'C' fechado com a haste reta à esquerda -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="
    M 80,160
    H 196
    C 246,160 274,196 274,256
    C 274,316 246,352 196,352
    H 80
    Z
    M 136,208
    V 304
    H 192
    C 220,304 234,286 234,256
    C 234,226 220,208 192,208
    Z
  "/>

  <!-- LETRA J: Reta sem barra no topo, gancho curvo inferior idêntico ao modelo original -->
  <path fill="url(#djGold)" d="
    M 352,160
    H 412
    V 304
    C 412,338 388,352 352,352
    C 300,352 268,332 264,288
    L 316,288
    C 318,304 332,312 352,312
    C 366,312 372,302 372,288
    V 160
    Z
  "/>
</svg>